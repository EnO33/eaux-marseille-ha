name: Dependabot auto-approve

# Auto-approve and enable auto-merge on patch-level Dependabot PRs that
# pass the rest of the CI matrix. Major and minor bumps stay manual so
# the maintainer reviews behaviour-affecting changes.
#
# Branch protection still gates the actual merge on the five required
# status checks; this workflow just removes the manual click once those
# checks are green.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-approve:
    name: Approve and enable auto-merge
    runs-on: ubuntu-latest
    # The PR author, not github.actor: the actor is whoever triggered the
    # last event, which can be Dependabot on a PR someone else opened.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
