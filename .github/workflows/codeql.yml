name: CodeQL

# GitHub's native security analysis. Catches common Python issues
# (injection, hard-coded secrets, weak crypto, unsafe deserialisation,
# etc.) that mypy and ruff don't cover. Free for public repos.
#
# Findings appear in the Security tab of the repository.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:30 Europe/Paris (matches dependabot's
    # cadence) so dormant issues are picked up even on quiet weeks.
    - cron: "30 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
