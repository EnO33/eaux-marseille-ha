name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so a new Home Assistant beta that breaks us is caught even
  # when no PR is open (same cadence as Dependabot and the upstream check).
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned by commit SHA. Dependabot bumps the ones that carry a
# version tag; hassfest and the HACS action only publish from a branch, so
# their pins are refreshed by hand.

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: python -m ruff check custom_components/ tests/
      - name: Format check
        run: python -m ruff format --check custom_components/ tests/

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_quality.txt
      - name: Architecture (import-linter)
        run: lint-imports
      - name: Dependency hygiene (deptry)
        run: python -m deptry custom_components/eaux_marseille
      - name: Dead code (vulture)
        run: python -m vulture
      - name: Duplication (pylint)
        run: python -m pylint custom_components/eaux_marseille --disable=all --enable=duplicate-code --score=n

  # Typecheck and Pytest run against three Home Assistant channels: the
  # latest stable release, the latest release overall (a beta during HA's
  # beta week) and the minimum version declared in hacs.json. The stable
  # leg keeps the historical job names, which branch protection requires.
  # See .github/scripts/phacc_version.py.
  typecheck:
    name: Typecheck (mypy strict)${{ matrix.ha != 'stable' && format(' - HA {0}', matrix.ha) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [stable, latest, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          PHACC=$(python .github/scripts/phacc_version.py ${{ matrix.ha }})
          pip install mypy -r requirements_test.txt "pytest-homeassistant-custom-component==$PHACC"
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: Mypy
        run: python -m mypy custom_components/eaux_marseille/

  test:
    name: Pytest${{ matrix.ha != 'stable' && format(' - HA {0}', matrix.ha) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [stable, latest, minimum]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Aligned with the Python version Home Assistant currently ships
          # (HA 2026.x runs on Python 3.14). Older versions used to be in
          # the matrix but recent pytest-homeassistant-custom-component
          # releases require 3.14, which makes a multi-version matrix
          # impractical without diverging dependency pins.
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          PHACC=$(python .github/scripts/phacc_version.py ${{ matrix.ha }})
          pip install -r requirements_test.txt "pytest-homeassistant-custom-component==$PHACC"
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=custom_components.eaux_marseille \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HACS
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
