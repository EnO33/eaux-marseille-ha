name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run so a new Home Assistant beta that breaks us is caught even
  # when no PR is open (same cadence as Dependabot and the upstream check).
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: python -m ruff check custom_components/ tests/
      - name: Format check
        run: python -m ruff format --check custom_components/ tests/

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_quality.txt
      - name: Architecture (import-linter)
        run: lint-imports
      - name: Dependency hygiene (deptry)
        run: python -m deptry custom_components/eaux_marseille
      - name: Dead code (vulture)
        run: python -m vulture
      - name: Duplication (pylint)
        run: python -m pylint custom_components/eaux_marseille --disable=all --enable=duplicate-code --score=n

  # Typecheck and Pytest run against two Home Assistant channels: the
  # latest stable release and the latest release overall (a beta during
  # HA's beta week). The stable leg keeps the historical job names, which
  # branch protection requires. See .github/scripts/phacc_version.py.
  typecheck:
    name: Typecheck (mypy strict)${{ matrix.ha == 'latest' && ' - HA latest' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [stable, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          PHACC=$(python .github/scripts/phacc_version.py ${{ matrix.ha }})
          pip install mypy -r requirements_test.txt "pytest-homeassistant-custom-component==$PHACC"
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - name: Mypy
        run: python -m mypy custom_components/eaux_marseille/

  test:
    name: Pytest${{ matrix.ha == 'latest' && ' - HA latest' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [stable, latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Aligned with the Python version Home Assistant currently ships
          # (HA 2026.x runs on Python 3.14). Older versions used to be in
          # the matrix but recent pytest-homeassistant-custom-component
          # releases require 3.14, which makes a multi-version matrix
          # impractical without diverging dependency pins.
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          PHACC=$(python .github/scripts/phacc_version.py ${{ matrix.ha }})
          pip install -r requirements_test.txt "pytest-homeassistant-custom-component==$PHACC"
          python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=custom_components.eaux_marseille \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS
        uses: hacs/action@main
        with:
          category: integration
