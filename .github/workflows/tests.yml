name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: python -m ruff check custom_components/ tests/
      - name: Format check
        run: python -m ruff format --check custom_components/ tests/

  typecheck:
    name: Typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -r requirements_test.txt
      - name: Mypy
        run: python -m mypy custom_components/eaux_marseille/

  test:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Aligned with the Python version Home Assistant currently ships
          # (HA 2026.x runs on Python 3.14). Older versions used to be in
          # the matrix but recent pytest-homeassistant-custom-component
          # releases require 3.14, which makes a multi-version matrix
          # impractical without diverging dependency pins.
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=custom_components.eaux_marseille \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=95

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: HACS
        uses: hacs/action@main
        with:
          category: integration
