rules:
  # Bronze
  action-setup:
    status: exempt
    comment: |
      This integration does not register any services / actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: |
      This integration does not register any services / actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: |
      This integration does not register any services / actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow: todo
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: exempt
    comment: |
      This is a cloud-polling integration with no discoverable endpoints.
  discovery:
    status: exempt
    comment: |
      This is a cloud-polling integration with no discoverable endpoints.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: |
      The integration manages a customer portal account, not physical devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: |
      The number of devices is fixed by the user's contracts; no dynamic discovery.
  entity-category: todo
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations:
    status: exempt
    comment: |
      Icons are derived from device_class; no custom MDI icons in code.
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: |
      One device per config entry, removed automatically on entry removal.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: |
      The integration uses a dedicated aiohttp session with its own cookie jar
      to isolate authentication state per contract; sharing Home Assistant's
      global session would cross-contaminate cookies between integrations.
  strict-typing: todo
