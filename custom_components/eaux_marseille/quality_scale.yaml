rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: |
      This is a cloud-polling integration with no discoverable endpoints.
  discovery:
    status: exempt
    comment: |
      This is a cloud-polling integration with no discoverable endpoints.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: |
      The integration manages a customer portal account, not physical devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      The number of devices is fixed by the user's contracts; no dynamic discovery.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: |
      Icons are derived from device_class; no custom MDI icons in code.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: |
      One device per config entry, removed automatically on entry removal.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: |
      The client needs a session whose connector uses aiohttp's
      ThreadedResolver (getaddrinfo). Home Assistant's client sessions,
      including async_create_clientsession, always get Home Assistant's
      connector with an aiodns-based resolver, which fails with "Could not
      contact DNS servers" on HAOS/Docker setups where UDP/53 to the upstream
      DNS is blocked but the OS resolves names fine (fixed in 1.10.1). A
      dedicated cookie jar alone would be possible with
      async_create_clientsession; the resolver is not.
  strict-typing: todo
